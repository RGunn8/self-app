# Planning tomorrow: suggested sessions and a new intention for an identity.
appId: com.ryangunn.identitydashboard
---
- runFlow: subflows/home.yaml
- tapOn: "Today, tab, 2 of 4"
- extendedWaitUntil:
    visible: "Plan week"
    timeout: 5000
- scrollUntilVisible:
    element: "Plan tomorrow"
    direction: DOWN
- tapOn: "Plan tomorrow"
- extendedWaitUntil:
    visible: "An intention"
    timeout: 5000
- takeScreenshot: 03-plan-tomorrow
- tapOn: "Call mom after lunch, read before bed…"
- inputText: "Write 300 words before work"
- hideKeyboard
- tapOn: "Writer"
- assertVisible: "Add to plan"
- takeScreenshot: 03b-intention-filled
- scrollUntilVisible:
    element: "Add to plan"
    direction: DOWN
- tapOn: "Add to plan"
- runFlow:
    when:
      visible: "Not now"
    commands:
      - takeScreenshot: 03c-reminder-offer
      - tapOn: "Not now"
- waitForAnimationToEnd
- takeScreenshot: 03d-after-add
